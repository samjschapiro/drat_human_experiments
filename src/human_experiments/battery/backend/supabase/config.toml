# Supabase CLI project config for the battery backend.
#
# The CLI's project root is battery/backend/ (it looks for ./supabase/ there);
# deploy.sh runs from that directory. Everything not set here uses CLI defaults.

project_id = "drat-battery"

[db]
major_version = 17

# The gateway's JWT check is off for every function: participants have no
# Supabase session. Each function authorizes requests itself:
#   start-session            issued study code (study_codes table)
#   save-block, finish-session  per-session bearer token from start-session
#   get-data, admin          DATA_EXPORT_TOKEN (researchers only)
# All database access inside the functions uses the service-role key, which
# never leaves the server.
[functions.start-session]
verify_jwt = false

[functions.save-block]
verify_jwt = false

[functions.finish-session]
verify_jwt = false

[functions.get-data]
verify_jwt = false

[functions.admin]
verify_jwt = false
