<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thinking Tasks</title>

    <!-- jsPsych 7.x core + plugins via CDN -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
    <script src="https://unpkg.com/@jspsych/plugin-instructions@1.1.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.2"></script>

    <style>
        /* Same look as the Kombine generation study: system font, #007bff buttons, #f5f5f5 bg. */
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f5f5f5; margin: 0; padding: 0; }
        .jspsych-content { max-width: 950px; font-size: 16px; }
        .jspsych-btn { font-size: 16px; padding: 12px 24px; margin: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .jspsych-btn:hover { background-color: #0056b3; }

        .kb-eyebrow { font-size: 13px; font-weight: bold; letter-spacing: .05em; text-transform: uppercase; color: #666; margin-bottom: 6px; }
        .kb-ask { color: #333; font-size: 16px; margin: 6px 0 18px; }
        .kb-ask b { font-weight: bold; }
        .kb-progress { font-size: 14px; color: #666; }
        .kb-timer { font-size: 14px; font-weight: bold; color: #374151; margin: -8px 0 12px; }

        .kb-pair { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 8px 0 6px; }
        .kb-chip { font-size: 20px; font-weight: bold; padding: 9px 16px; border-radius: 8px; }
        .kb-chip.a { color: #1976d2; background: #e3f2fd; }
        .kb-chip.b { color: #f57c00; background: #fff3e0; }
        .kb-chip.solo { color: #388e3c; background: #e8f5e9; }
        .kb-tween { font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: #666; }

        /* a situation / scenario shown as the stimulus (science ideas) */
        .kb-stim { background: #e3f2fd; border: 1px solid #bbdefb; border-radius: 8px; padding: 12px 14px; margin: 8px 0 6px; font-size: 17px; color: #333; }

        .kb-field { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; }
        .kb-field label { font-size: 14px; font-weight: bold; color: #333; }
        .kb-field input[type=text], .kb-field textarea {
            font-family: inherit; font-size: 15px; color: #333; background: #fff; border: 1px solid #ccc;
            border-radius: 5px; padding: 10px 12px; width: 100%; box-sizing: border-box; resize: vertical;
        }
        .kb-field input:focus, .kb-field textarea:focus { outline: none; border-color: #007bff; box-shadow: 0 0 0 3px rgba(0,123,255,.15); }
        .kb-field input[readonly], .kb-field textarea[readonly] { background: #f5f5f5; }

        /* numbered single-word boxes (different words / connected but different) */
        .kb-words { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; margin: 10px 0 4px; }
        .kb-words .w { display: flex; align-items: center; gap: 8px; }
        .kb-words .tnum { color: #888; font-size: 13px; width: 18px; flex: none; text-align: right; }
        .kb-words input { flex: 1; min-width: 0; font-family: inherit; font-size: 15px; color: #333; background: #fff;
            border: 1px solid #ccc; border-radius: 5px; padding: 8px 10px; box-sizing: border-box; }
        .kb-words input:focus { outline: none; border-color: #007bff; box-shadow: 0 0 0 3px rgba(0,123,255,.15); }
        .kb-words input[readonly] { background: #f5f5f5; }

        .kb-example { margin: 16px 0 2px; font-size: 14px; color: #666; }
        .kb-example summary { cursor: pointer; color: #007bff; font-size: 14px; }
        .kb-example .body { margin-top: 8px; padding: 10px 12px; border-left: 3px solid #007bff; background: #e3f2fd; border-radius: 0 5px 5px 0; }
        .kb-example .kb-stim { background: #fff; }

        .kb-debugbar { position: fixed; top: 8px; right: 8px; z-index: 1000; display: flex; gap: 6px; align-items: center; background: #fff3cd; border: 1px solid #e0a800; border-radius: 6px; padding: 6px 8px; font-size: 12px; color: #664d03; }
        .kb-debugbar button { font-size: 12px; padding: 4px 8px; border: 1px solid #b08d2a; border-radius: 4px; background: #fff; color: #664d03; cursor: pointer; }
        .kb-debugbar button:hover { background: #fffaf0; }

        @media (max-width: 560px) {
            .jspsych-content { font-size: 15px; padding: 0 6px; }
            .kb-chip { font-size: 17px; padding: 8px 12px; }
            .kb-words { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>

    <!-- Generated bundle: window.BATTERY_CONFIG + window.ITEM_BANKS.
         Must load before the test modules and core.js. -->
    <script src="js/battery-data.js"></script>

    <!-- Deployment config: window.BATTERY_RUNTIME = { API_BASE, COMPLETION_URL }.
         Gitignored; written by deploy.sh (or prepare_battery.py as a stub). -->
    <script src="js/config.js"></script>

    <!-- Shared helpers + self-registering test modules (before core.js). -->
    <script src="js/countdown.js"></script>
    <script src="js/tests/dat.js"></script>
    <script src="js/tests/rat.js"></script>
    <script src="js/tests/sctt.js"></script>
    <script src="js/tests/drat.js"></script>

    <!-- Engine: resolves slot → order, runs the battery, submits. -->
    <script src="js/core.js"></script>
</body>
</html>
